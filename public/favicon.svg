<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="zapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181924" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle for maximum contrast on light and dark browser tabs -->
  <rect width="32" height="32" rx="8" fill="url(#bgGradient)" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="#2e303f" stroke-width="1" stroke-opacity="0.8" />

  <!-- Lucide Zap Icon (scaled and centered inside 32x32 canvas) -->
  <g transform="translate(4, 4)">
